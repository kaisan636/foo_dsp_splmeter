name: Build (macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest foobar2000 SDK download URL
        id: sdk
        run: |
          PAGE=$(curl -fsSL https://www.foobar2000.org/SDK)
          URL=$(echo "$PAGE" | grep -oE 'href="[^"]*SDK[^"]*\.(7z|zip)"' | head -1 | sed 's/href="//; s/"//')
          case "$URL" in
            http*) ;;
            /*) URL="https://www.foobar2000.org$URL" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "SDK URL: $URL"

      - name: Download and unpack SDK
        run: |
          brew install p7zip
          curl -fsSL -o sdk.7z "${{ steps.sdk.outputs.url }}"
          mkdir sdk
          7z x -osdk sdk.7z >/dev/null
          echo "--- SDK root ---"; ls -la sdk
          echo "--- tree (3 levels) ---"; find sdk -maxdepth 3 -type d | sort | head -40
          echo "--- all xcodeprojs ---"; find sdk -name "*.xcodeproj" | head -20

      - name: Discover SDK build scheme and build component
        run: |
          set -e
          echo "--- pfc targets ---"
          xcodebuild -project sdk/pfc/pfc.xcodeproj -list
          echo "--- foo_sample targets (reference build layout) ---"
          xcodebuild -project sdk/foobar2000/foo_sample/foo_sample.xcodeproj -list

      - name: Build component
        run: |
          xcodebuild -project foo_dsp_splmeter.xcodeproj -target foo_dsp_splmeter \
            -configuration Release CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify artifact
        run: |
          ls -la build/Release/
          file build/Release/foo_dsp_splmeter.component/Contents/MacOS/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: foo_dsp_splmeter.component
          path: build/Release/foo_dsp_splmeter.component

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/Release
          zip -r ../../foo_dsp_splmeter.component.zip foo_dsp_splmeter.component
          cd ../..
          gh release create "${{ github.ref_name }}" foo_dsp_splmeter.component.zip \
            --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
